services:
  # Backend API Service
  - type: web
    name: custora-backend
    runtime: python
    region: oregon  # Change to your preferred region
    plan: starter  # free, starter, standard, pro
    branch: main
    buildCommand: pip install -r requirements.txt
    # Paid Render services run this before deploy. The application also applies
    # this idempotent migration at startup, which covers free/manual services.
    preDeployCommand: python run_channel_security_migration.py
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # Environment
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DOCS
        value: true

      # Python
      - key: PYTHON_VERSION
        value: 3.11.0

      # API Configuration
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        fromService:
          type: web
          name: custora-backend
          property: port

      # Database - Add these in Render Dashboard (Secrets)
      - key: DATABASE_URL
        sync: false  # Set manually in dashboard
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false

      # Database Pool
      - key: DB_POOL_MIN_SIZE
        value: 2
      - key: DB_POOL_MAX_SIZE
        value: 10

      # OpenAI - Set in Dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: gpt-4o

      # Groq - primary production agent provider
      - key: USE_GROQ
        value: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # Kafka (Optional - disable for initial deployment)
      - key: KAFKA_ENABLED
        value: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: localhost:9092

      # Gmail
      - key: GMAIL_ENABLED
        value: true
      - key: GMAIL_ADDRESS
        value: custora.support@gmail.com
      - key: GMAIL_CREDENTIALS_JSON
        sync: false
      - key: GMAIL_TOKEN_JSON
        sync: false
      - key: EMAIL_POLL_SECRET
        sync: false

      # WhatsApp
      - key: WHATSAPP_ENABLED
        value: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_WEBHOOK_URL
        value: https://crm-customer-support-digital-fte.onrender.com/api/v1/channels/whatsapp/webhook
      - key: TWILIO_VALIDATE_SIGNATURES
        value: true

      # Web Form (Enable)
      - key: WEBFORM_ENABLED
        value: true

      # CORS - Update with your frontend URL
      - key: API_CORS_ORIGINS
        value: https://custora-tau.vercel.app,http://localhost:3000

      # Logging
      - key: LOG_LEVEL
        value: INFO

      # Worker
      - key: WORKER_POOL_SIZE
        value: 2
      - key: CHANNEL_JOB_WORKER_ENABLED
        value: true

      # Better Auth
      - key: BETTER_AUTH_SECRET
        sync: false  # Set manually - min 32 chars
      - key: BETTER_AUTH_URL
        sync: false  # Set to your frontend URL
